[workspace]
members = [
    "crates/arc-core",
    "crates/arc-storage",
    "crates/arc-ipc",
    "crates/arc-daemon",
    "crates/arc-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
arc-core = { path = "crates/arc-core" }
arc-ipc = { path = "crates/arc-ipc" }
arc-storage = { path = "crates/arc-storage" }
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
