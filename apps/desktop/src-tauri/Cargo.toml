[package]
name = "arc-desktop"
version.workspace = true
edition.workspace = true
build = "build.rs"
default-run = "arc-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
arc-core.workspace = true
arc-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.3"

[dev-dependencies]
libc.workspace = true
tauri = { version = "=2.12.5", features = ["test"] }

# Opt-in native observation harness. It runs the production Wry application and
# existing hide lifecycle, without automation, a browser driver or screenshots.
[[example]]
name = "host-meter-desktop"
path = "tests/fixtures/host_meter_desktop.rs"
