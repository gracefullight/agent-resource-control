workspace:
  root: /Users/gracefullight/workspace/arc
actor:
  type: codex
  timeout: 7200  # a fresh isolated clone rebuilds cargo; full gate collection with coverage exceeds 60 minutes
chief:
  review_vendor: off  # only codex has quota on this host; opencode/qwen reviews hang or answer prose
  memory: true
  routing:
    min_samples: 3
    min_success_rate: 0.5
    candidates:
      - actor_type: codex
      - actor_type: claude  # takes over while codex cools down after a timeout
