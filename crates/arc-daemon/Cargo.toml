[package]
name = "arc-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
arc-core.workspace = true
arc-policy.workspace = true
arc-meter.workspace = true
arc-platform.workspace = true
arc-ipc.workspace = true
arc-storage.workspace = true
arc-traffic.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Explicit pressure-source fixture reuses resident production startup.
[[bin]]
name = "arc-pressure-daemon-fixture"
path = "tests/fixtures/memory_pressure_daemon.rs"

[[bin]]
name = "arc-recovery-daemon-fixture"
path = "tests/fixtures/recovery_daemon.rs"

# Injected clock, explicit pass trigger and named evidence faults for the
# bounded Reaper. Shares resident startup; the seams live in src/reaper/.
[[bin]]
name = "arc-reaper-daemon-fixture"
path = "tests/fixtures/reaper_daemon.rs"
